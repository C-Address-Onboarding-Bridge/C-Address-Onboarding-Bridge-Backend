global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: c-address-bridge
    static_configs:
      - targets: ['api:3001']
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/prometheus_scrape_key

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
