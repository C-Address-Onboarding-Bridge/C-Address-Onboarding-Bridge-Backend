receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  # Sampling is applied once, at the API (OTEL_TRACE_SAMPLE_RATIO, default 0.1).
  # Do not sample again here, otherwise the effective ratio is squared
  # (0.1 * 0.1 = ~1% of traces reaching Jaeger).

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
