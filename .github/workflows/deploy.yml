name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: 'Docker image tag to promote (defaults to latest on branch)'
        required: false

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  # ── CI gate (always required) ──────────────────────────────────────────────
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  # ── Build & push image ─────────────────────────────────────────────────────
  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # gha cache export requires the docker-container buildx driver
      - uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Dev: auto-deploy on every push to main (single target, fast iteration) ──
  deploy-dev:
    name: Deploy → dev
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: dev
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Skip when no dev environment is configured
        if: env.DEPLOY_HOST == ''
        run: echo "DEPLOY_HOST secret not set; skipping dev deploy."

      - uses: actions/checkout@v4
        if: env.DEPLOY_HOST != ''

      - name: Run migrations
        if: env.DEPLOY_HOST != ''
        run: npm run migrate -w api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: development

      - name: Deploy API
        if: env.DEPLOY_HOST != ''
        run: bash scripts/deploy-api.sh
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

      - name: Smoke tests
        if: env.DEPLOY_HOST != ''
        run: bash scripts/smoke-test.sh
        env:
          APP_URL: ${{ vars.APP_URL }}
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}

      - name: Rollback on failure
        if: failure() && env.DEPLOY_HOST != ''
        run: bash scripts/deploy-api.sh --rollback
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

  # ── Staging: manual promote, blue/green for zero-downtime releases ────────
  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Run migrations
        run: npm run migrate -w api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: staging

      - name: Restore blue/green state
        uses: actions/cache/restore@v4
        with:
          path: deployments/blue-green-state.txt
          key: blue-green-state-staging
          restore-keys: blue-green-state-staging-

      - name: Blue/green deploy
        run: bash scripts/blue-green-deploy.sh
        env:
          BLUE_URL: ${{ vars.BLUE_APP_URL }}
          GREEN_URL: ${{ vars.GREEN_APP_URL }}
          BLUE_DEPLOY_HOST: ${{ secrets.BLUE_DEPLOY_HOST }}
          GREEN_DEPLOY_HOST: ${{ secrets.GREEN_DEPLOY_HOST }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag || needs.build.outputs.image_tag }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_BLUE_COMMAND: DEPLOY_HOST="$BLUE_DEPLOY_HOST" bash scripts/deploy-api.sh
          DEPLOY_GREEN_COMMAND: DEPLOY_HOST="$GREEN_DEPLOY_HOST" bash scripts/deploy-api.sh
          SMOKE_TEST_SCRIPT: scripts/smoke-test.sh
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          POST_SWITCH_CHECK_COMMAND: bash scripts/smoke-test.sh
          DRAIN_GRACE_SECONDS: '30'
          WARMUP_WINDOW_SECONDS: '60'

      - name: Save blue/green state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: deployments/blue-green-state.txt
          key: blue-green-state-staging-${{ github.run_id }}

  # ── Production: 2-approver manual promote, blue/green for zero-downtime ───
  deploy-production:
    name: Deploy → production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production          # GitHub Environment — configure 2 required reviewers here
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Run migrations
        run: npm run migrate -w api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production

      - name: Restore blue/green state
        uses: actions/cache/restore@v4
        with:
          path: deployments/blue-green-state.txt
          key: blue-green-state-production
          restore-keys: blue-green-state-production-

      - name: Blue/green deploy
        run: bash scripts/blue-green-deploy.sh
        env:
          BLUE_URL: ${{ vars.BLUE_APP_URL }}
          GREEN_URL: ${{ vars.GREEN_APP_URL }}
          BLUE_DEPLOY_HOST: ${{ secrets.BLUE_DEPLOY_HOST }}
          GREEN_DEPLOY_HOST: ${{ secrets.GREEN_DEPLOY_HOST }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag || needs.build.outputs.image_tag }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_BLUE_COMMAND: DEPLOY_HOST="$BLUE_DEPLOY_HOST" bash scripts/deploy-api.sh
          DEPLOY_GREEN_COMMAND: DEPLOY_HOST="$GREEN_DEPLOY_HOST" bash scripts/deploy-api.sh
          SMOKE_TEST_SCRIPT: scripts/smoke-test.sh
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          POST_SWITCH_CHECK_COMMAND: bash scripts/smoke-test.sh
          SWITCH_TRAFFIC_COMMAND: ${{ vars.SWITCH_TRAFFIC_COMMAND }}

      - name: Save blue/green state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: deployments/blue-green-state.txt
          key: blue-green-state-production-${{ github.run_id }}
