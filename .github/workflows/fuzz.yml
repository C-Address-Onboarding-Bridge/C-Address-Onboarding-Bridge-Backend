name: Fuzz Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js environment
      uses: ./.github/actions/setup-node-env
    - name: Run Fuzz Tests
      run: npm run test --workspace=sdk -- --run tests/fuzz.test.ts

  # These "fuzz targets" are self-contained property-test binaries (their own
  # main() and an LCG), not libFuzzer targets -- the crate has no libfuzzer-sys
  # dependency and no `cargo-fuzz = true` metadata, so `cargo fuzz run` rejected
  # it with "does not look like a cargo-fuzz manifest" on every run. They are
  # now run the way they are written: `cargo run --release --bin <target>` on
  # stable, with no nightly toolchain or cargo-fuzz install needed.
  rust-fuzz:
    name: Rust Property Fuzz Targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('contracts/onboarding-bridge/fuzz/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fuzz-

      - name: Run fuzz_fee_calculation (100k iterations)
        run: cargo run --release --bin fuzz_fee_calculation
        working-directory: contracts/onboarding-bridge/fuzz

      - name: Run fuzz_fund_sequence (100k iterations)
        run: cargo run --release --bin fuzz_fund_sequence
        working-directory: contracts/onboarding-bridge/fuzz

      - name: Run fuzz_admin_ops (100k iterations)
        run: cargo run --release --bin fuzz_admin_ops
        working-directory: contracts/onboarding-bridge/fuzz
