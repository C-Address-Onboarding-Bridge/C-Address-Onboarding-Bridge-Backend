name: Fuzz Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly fuzzing at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      fuzz_iterations:
        description: 'Number of iterations per fuzz target'
        required: false
        default: '10000'
      fuzz_seed:
        description: 'Seed for the fuzz targets'
        required: false
        default: '0'

env:
  # Configurable time budget per fuzz target (in iterations)
  FUZZ_ITERATIONS: ${{ github.event.inputs.fuzz_iterations || '10000' }}
  FUZZ_SEED: ${{ github.event.inputs.fuzz_seed || '0' }}

jobs:
  # These "fuzz targets" are self-contained property-test binaries (their own
  # main() and an LCG), not libFuzzer targets -- the crate has no libfuzzer-sys
  # dependency and no `cargo-fuzz = true` metadata, so `cargo fuzz run` rejected
  # it with "does not look like a cargo-fuzz manifest" on every run. They are
  # now run the way they are written: `cargo run --release --bin <target>` on
  # stable, with no nightly toolchain or cargo-fuzz install needed.
  rust-fuzz:
    name: Rust Property Fuzz Targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/onboarding-bridge

      - name: Build fuzz targets
        run: |
          cd contracts/onboarding-bridge/fuzz
          cargo build --release

      - name: Run fuzz_fee_calculation
        run: |
          cd contracts/onboarding-bridge/fuzz
          cargo run --release --bin fuzz_fee_calculation -- ${{ env.FUZZ_SEED }} ${{ env.FUZZ_ITERATIONS }}

      - name: Run fuzz_fund_sequence
        run: |
          cd contracts/onboarding-bridge/fuzz
          cargo run --release --bin fuzz_fund_sequence -- ${{ env.FUZZ_SEED }} ${{ env.FUZZ_ITERATIONS }}

      - name: Run fuzz_admin_ops
        run: |
          cd contracts/onboarding-bridge/fuzz
          cargo run --release --bin fuzz_admin_ops -- ${{ env.FUZZ_SEED }} ${{ env.FUZZ_ITERATIONS }}

      - name: Run fuzz_invariants
        run: |
          cd contracts/onboarding-bridge/fuzz
          cargo run --release --bin fuzz_invariants -- ${{ env.FUZZ_SEED }} ${{ env.FUZZ_ITERATIONS }}

      - name: Run fuzz_upgrade
        run: |
          cd contracts/onboarding-bridge/fuzz
          cargo run --release --bin fuzz_upgrade -- ${{ env.FUZZ_SEED }} ${{ env.FUZZ_ITERATIONS }}

      - name: Upload fuzz findings (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-${{ github.run_id }}
          path: |
            contracts/onboarding-bridge/fuzz/
            !contracts/onboarding-bridge/fuzz/target/

  sdk-fuzz:
    name: SDK Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Run SDK Fuzz Tests
        run: npm run test --workspace=sdk -- --run tests/fuzz.test.ts
