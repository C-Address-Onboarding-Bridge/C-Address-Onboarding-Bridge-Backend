name: Fuzz Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js environment
      uses: ./.github/actions/setup-node-env
    - name: Run Fuzz Tests
      run: npm run test --workspace=sdk -- --run tests/fuzz.test.ts
