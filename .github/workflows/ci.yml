name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  soroban-contract:
    name: Soroban Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32v1-none
          # There is no Cargo.toml at the repo root; without this the action's
          # cache step logged "could not find Cargo.toml" on every run.
          cache-workspaces: contracts/onboarding-bridge

      - name: Check formatting
        working-directory: contracts/onboarding-bridge
        run: cargo fmt --check

      - name: Clippy
        working-directory: contracts/onboarding-bridge
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: contracts/onboarding-bridge
        run: cargo test

      - name: Build WASM (release)
        working-directory: contracts/onboarding-bridge
        run: cargo build --target wasm32v1-none --release

  api-server:
    name: API Server
    runs-on: ubuntu-latest
    # src/__tests__/queue.test.ts drives real BullMQ queues, which need Redis.
    # Without a Redis on localhost:6379 those 7 tests time out at 5s (they pass
    # on any dev machine that has Redis running, which is why this was missed).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint --ext .ts src/

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint --ext .ts src/

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size check
        run: npm run bundle:check

      - name: Upload bundle analysis report
        uses: actions/upload-artifact@v4
        with:
          name: sdk-bundle-analysis
          path: sdk/dist/bundle/meta.json
          retention-days: 30

      - name: Verify strict consumer build
        run: npm run build:strict-consumer

  hooks:
    name: React Hooks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hooks
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Build sdk workspace dependency
        working-directory: .
        run: npm run build --workspace sdk

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint --ext .ts,.tsx src/

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Run E2E tests
        run: npx vitest run --config vitest.e2e.config.ts
        env:
          NODE_ENV: test
          SOROBAN_RPC_URL: https://soroban-rpc.testnet.stellar.org
          BRIDGE_FEE_BPS: '30'
          API_KEYS: ci-test-key

  webhook-sim:
    name: Webhook Simulation Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Run webhook simulation tests
        run: npm run test:webhook-sim
        env:
          NODE_ENV: test
          SOROBAN_RPC_URL: https://soroban-rpc.testnet.stellar.org
          BRIDGE_FEE_BPS: '30'
          API_KEYS: ci-test-key
          MOONPAY_SECRET_KEY: sim-moonpay-secret
          TRANSAK_WEBHOOK_SECRET: sim-transak-secret

  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: [soroban-contract, api-server, sdk, e2e, webhook-sim]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SOURCE_ACCOUNT: ${{ secrets.SOROBAN_SOURCE_ACCOUNT }}
    steps:
      - name: Skip when deploy credentials are not configured
        if: env.SOURCE_ACCOUNT == ''
        run: echo "SOROBAN_SOURCE_ACCOUNT secret not set; skipping testnet deploy."

      - uses: actions/checkout@v4
        if: env.SOURCE_ACCOUNT != ''

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: env.SOURCE_ACCOUNT != ''
        with:
          toolchain: stable
          target: wasm32v1-none

      - name: Install Stellar CLI
        if: env.SOURCE_ACCOUNT != ''
        run: cargo install stellar-cli --locked

      - name: Deploy contract to testnet
        if: env.SOURCE_ACCOUNT != ''
        run: bash scripts/deploy.sh --network testnet
        env:
          BRIDGE_FEE_BPS: '30'

      - name: Upload deployment artifacts
        if: env.SOURCE_ACCOUNT != ''
        uses: actions/upload-artifact@v4
        with:
          name: deployment-testnet
          path: deployments/deployment-testnet.json
          retention-days: 90
