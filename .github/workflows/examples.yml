name: Multi-Language Examples

on:
  push:
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'
  pull_request:
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'
  workflow_dispatch:

jobs:
  examples:
    name: Verify all language examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run all language examples + unit tests via verify-examples.sh
        run: bash examples/scripts/verify-examples.sh

  docker-compose:
    name: Docker Compose Examples
    runs-on: ubuntu-latest
    # Run each client service in isolation so one fast client can't tear down
    # the others before they finish, and so each service's exit code is
    # captured individually.
    strategy:
      fail-fast: false
      matrix:
        service: [python, rust, go, java]
    steps:
      - uses: actions/checkout@v4

      - name: Run ${{ matrix.service }} example against mock
        working-directory: examples
        run: |
          docker compose run --rm ${{ matrix.service }}
